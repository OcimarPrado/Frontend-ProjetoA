<title>Nayco | Sites e hospedagem</title>

<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#07111f; --bg2:#0b1a2e; --line:#1d3250; --ink:#e8f0f8; --mute:#8fa3bb;
  --cyan:#22d3ee; --orange:#ff8a3d; --ti:#c4ccd6;
  --head:"Montserrat",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{background:var(--bg);color:var(--ink);font:400 17px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
h1,h2,h3{font-family:var(--head);font-weight:800;line-height:1.1;letter-spacing:-.02em}
h2{font-size:clamp(28px,4vw,40px);margin-bottom:14px}
section{padding:88px 0}
.lead{color:var(--mute);max-width:58ch}

/* nav */
header{position:sticky;top:0;z-index:10;background:rgba(7,17,31,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;gap:22px;height:64px}
.logo{font:800 22px var(--head);text-decoration:none;letter-spacing:-.03em}
.logo i{font-style:normal;color:var(--cyan)}
nav ul{display:flex;gap:22px;list-style:none;padding:0;margin:0 auto 0 28px}
nav ul a{text-decoration:none;color:var(--mute);font-size:15px}
nav ul a:hover{color:var(--ink)}
.lang{display:flex;gap:2px;border:1px solid var(--line);border-radius:6px;padding:2px}
.lang button{background:none;border:0;color:var(--mute);font:500 12px var(--mono);padding:5px 8px;border-radius:4px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--cyan);color:#04202a}
.btn{display:inline-block;background:var(--cyan);color:#04202a;font:800 15px var(--head);text-decoration:none;padding:14px 24px;border-radius:6px;transition:transform .15s}
.btn{position:relative;overflow:hidden}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 24px -8px rgba(34,211,238,.55)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.4) 50%,transparent 65%);transform:translateX(-120%);transition:transform .6s}
.btn:hover::after{transform:translateX(120%)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
nav .btn{padding:9px 16px;font-size:14px}

/* hero */
.hero{padding:72px 0 88px;background:radial-gradient(520px 320px at var(--mx,85%) var(--my,10%),rgba(34,211,238,.15),transparent 65%)}
.hero .grid{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center}
h1{font-size:clamp(36px,5.6vw,62px);margin-bottom:20px}
.hero .lead{font-size:19px;margin-bottom:30px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.term{background:#040b15;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 30px 60px -30px #000}
.term .bar{display:flex;gap:7px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--bg2)}
.term .bar b{width:10px;height:10px;border-radius:50%;background:var(--line)}
.term pre{font:400 13.5px/1.9 var(--mono);padding:18px 20px;min-height:290px;color:var(--ti);white-space:pre-wrap}
.term .ok{color:var(--cyan)} .term .or{color:var(--orange)} .term .dim{color:var(--mute)}
.caret{display:inline-block;width:8px;height:15px;background:var(--cyan);vertical-align:-2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}

/* services */
.svc{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:10px;margin-top:40px;overflow:hidden}
.svc article{padding:30px 26px;background:var(--bg2);position:relative;overflow:hidden}
.svc article::before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:var(--cyan);transform:scaleX(0);transform-origin:left;transition:transform .45s}
.svc article:hover::before{transform:scaleX(1)}
.svc h3{transition:color .3s}.svc article:hover h3{color:var(--cyan)}
.svc article+article{border-left:1px solid var(--line)}
.svc h3{font-size:20px;margin-bottom:10px}
.svc p{color:var(--mute);font-size:15.5px}

/* plans */
.plans{margin-top:40px;border-top:1px solid var(--line)}
.plan{display:grid;grid-template-columns:1.2fr 1.6fr auto;gap:24px;align-items:center;padding:26px 0;border-bottom:1px solid var(--line)}
.plan h3{font-size:22px}
.plan p{color:var(--mute);font-size:15.5px}
.price{font:500 15px var(--mono);text-align:right;color:var(--ti)}
.price strong{display:block;font:800 26px var(--head);color:var(--ink)}
.plan.hl h3{color:var(--cyan)}
.host{margin-top:32px;padding:26px;border:1px solid var(--cyan);border-radius:10px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;background:rgba(34,211,238,.05)}
.host h3{font-size:20px;margin-bottom:6px}
.host p{color:var(--mute);font-size:15.5px}

/* portfolio */
.work{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:40px}
.work figure{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg2)}
.work img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;background:var(--line)}
.work figcaption{padding:12px 16px;font:500 13px var(--mono);color:var(--mute)}
.work a{display:block;text-decoration:none;color:inherit}
.work a figcaption::after{content:" ↗";color:var(--cyan)}

/* about + contact */
.about{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.about ul{list-style:none;padding:0}
.about li{padding:14px 0 14px 22px;border-bottom:1px solid var(--line);position:relative;color:var(--ti)}
.about li::before{content:"";position:absolute;left:0;top:26px;width:8px;height:2px;background:var(--orange)}
.final{text-align:center;border-top:1px solid var(--line);background:var(--bg2)}
.final .lead{margin:0 auto 28px}
footer{padding:28px 0;color:var(--mute);font-size:14px;border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wa{position:fixed;right:18px;bottom:18px;z-index:20;width:54px;height:54px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.wa svg{width:28px;height:28px;fill:#fff}

/* movimento estilo Elementor */
html,body{overflow-x:clip}
.js [data-a]{opacity:0;transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.js [data-a=up]{transform:translateY(44px)}
.js [data-a=left]{transform:translateX(-56px)}
.js [data-a=right]{transform:translateX(56px)}
.js [data-a=zoom]{transform:scale(.9)}
.js [data-a].in{opacity:1;transform:none}
.js .w{display:inline-block;opacity:0;transform:translateY(36px);animation:wIn .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes wIn{to{opacity:1;transform:none}}
#bar{position:fixed;top:0;left:0;width:100%;height:3px;z-index:30;background:linear-gradient(90deg,var(--cyan),var(--orange));transform-origin:0 50%;transform:scaleX(0)}
header nav{transition:height .3s}
header.sm nav{height:52px}
.plan h3{transition:transform .35s,color .35s}
.plan:hover h3{transform:translateX(12px);color:var(--cyan)}
.work img{transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.work figure:hover img{transform:scale(1.07)}
.wa{transition:transform .25s}.wa:hover{transform:scale(1.1) rotate(-6deg)}
.wa::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #25d366;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{to{transform:scale(1.7);opacity:0}}
@media(max-width:860px){
  .js [data-a=left],.js [data-a=right]{transform:translateY(36px)}
}
@media(max-width:860px){
  nav ul{display:none} nav .lang{margin-left:auto}
  .hero .grid,.about,.host{grid-template-columns:1fr}
  .svc,.work{grid-template-columns:1fr}
  .svc article+article{border-left:0;border-top:1px solid var(--line)}
  .plan{grid-template-columns:1fr;gap:8px} .price{text-align:left}
  section{padding:64px 0}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
<script>if(!matchMedia("(prefers-reduced-motion:reduce)").matches)document.documentElement.classList.add("js")</script>

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

function setLang(l){
  const d=T[l]; document.documentElement.lang=LANGS[l];
  $$("[data-i]").forEach(e=>e.textContent=d[e.dataset.i]);
  $$(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
  $$(".wa-link").forEach(a=>{a.href=`https://wa.me/${WHATS}?text=${encodeURIComponent(MSG[l])}`;a.target="_blank";a.rel="noopener"});
  $("#plans").innerHTML=PLANS.map(p=>`<div class="plan${p.hl?" hl":""}"><h3>${d[p.k+"t"]}</h3><p>${d[p.k+"d"]}</p><div class="price"><strong>${p.price}</strong>${d.setup}</div></div>`).join("");
  try{localStorage.setItem("nayco-lang",l)}catch(e){}
  runTerm(l);animH1();tagAll();
}
$$(".lang button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));

$("#hostPrice").textContent=HOST_PRICE;
$("#yr").textContent=new Date().getFullYear();
function card(img,alt,cap,url){
  const inner=`<img src="img/${img}" alt="${alt}" loading="lazy" onerror="this.style.visibility='hidden'">${cap}`;
  return `<figure>${url?`<a href="${url}" target="_blank" rel="noopener">${inner}</a>`:inner}</figure>`;
}
$("#work").innerHTML=WORK.map(w=>card(w[0],w[1],`<figcaption>${w[1]}</figcaption>`,w[2])).join("");
$("#demos").innerHTML=DEMOS.map(w=>card(w[0],"",`<figcaption data-i="${w[1]}"></figcaption>`,w[2])).join("");

/* Hero: simulação de deploy (único movimento da página) */
let termTimer;
function runTerm(l){
  clearTimeout(termTimer);
  const L={
   pt:["Criando seu site...","Ajustando para celular","Configurando domínio e SSL","Ativando backup diário","Publicando","No ar em 3 dias","Manutenção mensal ativa"],
   en:["Building your site...","Tuning for mobile","Setting up domain and SSL","Enabling daily backup","Publishing","Live in 3 days","Monthly maintenance active"],
   es:["Creando tu sitio...","Ajustando para móvil","Configurando dominio y SSL","Activando copia diaria","Publicando","En línea en 3 días","Mantenimiento mensual activo"]}[l];
  const lines=[
    `<span class="dim">$</span> nayco novo-site seunegocio.com.br`,
    `<span class="dim">›</span> ${L[0]}`,
    `<span class="ok">✓</span> ${L[1]}`,
    `<span class="ok">✓</span> ${L[2]}`,
    `<span class="ok">✓</span> ${L[3]}`,
    `<span class="or">›</span> ${L[4]}`,
    `<span class="ok">● ${L[5]}</span>`,
    `<span class="ok">✓</span> ${L[6]}`];
  const el=$("#term"); const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  if(reduce){el.innerHTML=lines.join("\n");return}
  let i=0; el.innerHTML="";
  (function next(){
    if(i>=lines.length){el.insertAdjacentHTML("beforeend","\n<span class='caret'></span>");return}
    el.insertAdjacentHTML("beforeend",(i?"\n":"")+lines[i++]);
    termTimer=setTimeout(next,i===1?500:650);
  })();
}

/* ===== Movimento (estilo Elementor) ===== */
var MOTION=document.documentElement.classList.contains("js"), plansShown=false;
document.body.insertAdjacentHTML("afterbegin",'<div id="bar"></div>');
var io=("IntersectionObserver" in window)?new IntersectionObserver(function(es){
  es.forEach(function(e){
    if(!e.isIntersecting)return;
    e.target.classList.add("in"); io.unobserve(e.target);
    if(e.target.classList.contains("plan"))plansShown=true;
  });
},{threshold:.15,rootMargin:"0px 0px -6% 0px"}):null;

function tag(sel,type,step,base){
  $$(sel).forEach(function(e,i){
    if(e.dataset.a)return;
    e.dataset.a=type; e.style.setProperty("--d",((base||0)+i*(step||0))+"s");
  });
}
function tagAll(){
  if(!MOTION)return;
  tag(".hero .lead","up",0,.45); tag(".hero .cta","up",0,.6); tag(".term","right",0,.35);
  tag("section:not(.hero) h2","up"); tag("section:not(.hero) .lead","up",0,.12);
  tag(".svc article","up",.15); tag(".plan","left",.12); tag(".host","zoom");
  tag(".work figure","zoom",.1); tag(".about ul li","right",.12);
  $$("[data-a]:not(.in)").forEach(function(e){
    if(e.classList.contains("plan")&&plansShown)e.classList.add("in");
    else if(io)io.observe(e); else e.classList.add("in");
  });
}
function animH1(){
  if(!MOTION)return;
  var h=$("h1");
  h.innerHTML=h.textContent.split(" ").map(function(w,i){
    return '<span class="w" style="animation-delay:'+(.1+i*.09)+'s">'+w+'</span>';
  }).join(" ");
}
if(MOTION){
  var tick=false;
  addEventListener("scroll",function(){
    if(tick)return; tick=true;
    requestAnimationFrame(function(){
      tick=false;
      var max=document.documentElement.scrollHeight-innerHeight;
      $("#bar").style.transform="scaleX("+(max>0?scrollY/max:0)+")";
      $("header").classList.toggle("sm",scrollY>40);
    });
  },{passive:true});
  var hero=$(".hero");
  hero.addEventListener("pointermove",function(e){
    var r=hero.getBoundingClientRect();
    hero.style.setProperty("--mx",(e.clientX-r.left)+"px");
    hero.style.setProperty("--my",(e.clientY-r.top)+"px");
  });
}

let saved=null; try{saved=localStorage.getItem("nayco-lang")}catch(e){}
setLang(T[saved]?saved:"pt");
</script>
